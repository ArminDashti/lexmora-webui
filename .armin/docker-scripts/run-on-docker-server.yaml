# Remote deploy settings — scripts read this file only (no CLI -- flags).
# Non-empty override fields replace values from compose_file / dockerfile.
# Fill ssh with a real value before running; leave placeholder until then.
# build_image_on: local = build here and upload; server = build on remote

stack_name: lexmora-webui
image_tag: lexmora-webui:latest
compose_file: ../../docker-compose.yml
dockerfile: ../../Dockerfile
docker_network: t3-net
api_host: lexmora-api
api_port: "8080"
internal_port: ""
publish_port: ""
delete_volume: "no"
delete_image: "yes"
build_image_on: "local"

ssh: "ssh t3"

volume_dir: "/home/cloud-admin/docker/lexmora-webui"
