services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${WEB_IMAGE_TAG:-translator-webui:latest}
    container_name: translator-webui
    expose:
      - "80"
    ports:
      - target: 80
        published: ${WEB_PUBLISH_PORT-8082}
        protocol: tcp
    environment:
      API_HOST: ${API_HOST:-translator-api}
      API_PORT: ${API_PORT:-8080}
    networks:
      - translator-net
    restart: unless-stopped

networks:
  translator-net:
    name: ${DOCKER_NETWORK:-translator-net}
    external: true
